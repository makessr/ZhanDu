<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/app-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>栈渡</title>
    <script>
      const hashParams = new URLSearchParams(window.location.hash.slice(1));
      const searchParams = new URLSearchParams(window.location.search);
      if (!hashParams.has("view") && !searchParams.has("view")) {
        document.documentElement.classList.add("main-window");
      }

      try {
        const savedAppearance = localStorage.getItem("fineshell.appearance-mode");
        const appearance =
          savedAppearance === "dark" ||
          (savedAppearance === "system" && matchMedia("(prefers-color-scheme: dark)").matches)
            ? "dark"
            : "light";
        document.documentElement.dataset.appearance = appearance;
        document.documentElement.style.colorScheme = appearance;
      } catch {
        document.documentElement.dataset.appearance = "light";
      }
    </script>
    <!-- Keep startup CSS external so Tauri does not add a style nonce that blocks xterm's runtime styles. -->
    <link rel="stylesheet" href="/startup.css" />
  </head>

  <body>
    <div class="startup-loader" id="startup-loader" role="status" aria-label="正在加载工作区">
      <div class="startup-loader-content">
        <div class="startup-loader-track" aria-hidden="true"></div>
        <div class="startup-loader-label">正在加载工作区</div>
      </div>
    </div>
    <div id="root"></div>
    <script>
      (() => {
        const loader = document.getElementById("startup-loader");
        if (!document.documentElement.classList.contains("main-window")) {
          loader?.remove();
          return;
        }

        let finished = false;
        const finish = () => {
          if (finished || !loader) return;
          finished = true;
          window.clearTimeout(fallbackTimer);
          loader.classList.add("is-leaving");
          window.setTimeout(() => loader.remove(), 180);
        };
        const fallbackTimer = window.setTimeout(() => {
          if (!loader) return;
          loader.querySelector(".startup-loader-track").hidden = true;
          loader.querySelector(".startup-loader-label").textContent =
            "工作区加载时间较长，可以继续等待或重新加载。";
          const retry = document.createElement("button");
          retry.type = "button";
          retry.textContent = "重新加载";
          retry.addEventListener("click", () => window.location.reload());
          loader.querySelector(".startup-loader-content").append(retry);
        }, 8000);
        window.addEventListener("fineshell:workspace-ready", finish, {
          once: true,
        });
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
