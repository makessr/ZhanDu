name: 缺陷报告
description: 报告可复现的问题（安全漏洞请改用私密漏洞报告）
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        提交前请先搜索现有 Issue。安全漏洞请通过 [私密漏洞报告](https://github.com/makessr/ZhanDu/security/advisories/new) 提交，不要公开细节。
  - type: input
    id: version
    attributes:
      label: 栈渡版本
      description: 关于页显示的版本号，例如 0.10.0
      placeholder: 0.10.0
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: 操作系统
      options:
        - Windows x64
        - Windows ARM64
        - macOS Apple Silicon
        - macOS Intel
        - Linux x64
        - Linux ARM64
        - 其他
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 按顺序列出能稳定复现的操作
      placeholder: |
        1. 打开……
        2. 点击……
        3. 出现……
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望结果与实际结果
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志或截图
      description: 请先清理主机地址、用户名、密钥等敏感信息
      render: text
  - type: checkboxes
    id: confirmation
    attributes:
      label: 确认
      options:
        - label: 我已确认日志与截图中不包含密码、私钥或服务器敏感信息
          required: true
