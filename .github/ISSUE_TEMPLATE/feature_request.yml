name: 功能建议
description: 提出新功能或改进建议
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        请先查看 [ARCHITECTURE.md](https://github.com/makessr/ZhanDu/blob/main/ARCHITECTURE.md#明确的范围边界) 中的范围边界（i18n、macOS 公证、第三方客户端导入、内部标识迁移、应用层静态加密）。
  - type: textarea
    id: problem
    attributes:
      label: 你遇到的问题
      description: 描述当前工作流中的不便，而不是直接给出实现方案
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的解决方式
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
  - type: dropdown
    id: area
    attributes:
      label: 涉及模块
      options:
        - SSH / 终端
        - SFTP / 文件
        - 服务器监控与诊断
        - 主机同步
        - AI 运维助手
        - 设置 / 界面
        - 发布 / 构建
        - 其他
    validations:
      required: true
