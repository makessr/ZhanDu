name: Verify public upgrade to ZhanDu v0.6.3

on:
  push:
    branches: [test/public-v063-ota]

permissions:
  contents: read

jobs:
  upgrade:
    name: ${{ matrix.platform }} ${{ matrix.arch }} public OTA
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            platform: macOS
            arch: arm64
            artifact: FineShell_0.6.2_darwin_aarch64.dmg
            digest: 1aefbc605cc6c790131c2c5266579cd968003e1efe932db7aa576656f731c94b
          - runner: macos-15-intel
            platform: macOS
            arch: x86_64
            artifact: FineShell_0.6.2_darwin_x64.dmg
            digest: b49e98dca7662a2a6e3bf83fb744c7dda566369f07b6607f5082b8da2f9cd580
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Verify public release manifests and baseline installer
        shell: bash
        env:
          ARTIFACT: ${{ matrix.artifact }}
          DIGEST: ${{ matrix.digest }}
        run: |
          set -Eeuo pipefail
          cd "$RUNNER_TEMP"
          for release in ZhanDu:0.6.3; do
            repo="${release%:*}"
            version="${release#*:}"
            url="https://github.com/makessr/$repo/releases/download/v$version"
            curl -fsSL --retry 3 "https://github.com/makessr/$repo/releases/latest/download/latest.json" |
              jq -e --arg version "$version" --arg url "$url/" '
                .version == $version and
                (.platforms | length > 0 and all(.[]; (.url | startswith($url)) and (.signature | length > 0)))
              '
          done
          curl -fsSL --retry 3 -o "$ARTIFACT" "https://github.com/makessr/ZhanDu/releases/download/v0.6.2/$ARTIFACT"
          printf '%s  %s\n' "$DIGEST" "$ARTIFACT" | shasum -a 256 --check
      - name: Upgrade through the macOS desktop
        if: runner.os == 'macOS'
        env:
          ARCH: ${{ matrix.arch }}
          ARTIFACT: ${{ matrix.artifact }}
        run: bash scripts/macos-smoke/ota.sh "$RUNNER_TEMP/$ARTIFACT" "$ARCH"

  windows-ota:
    name: Windows ${{ matrix.arch }} public OTA
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
            digest: 2c4e70f134bef6f6fdb26bbe85cd2267bad16eb35ab66e9fd15f5313d311d97d
          - arch: arm64
            runner: windows-11-arm
            digest: f750075c77011d5a814d9b91e17ce6afe3fa404824e7806a48e4bdee51cda7ab
    env:
      WINDOWS_ARCH: ${{ matrix.arch }}
      BASELINE_SHA256: ${{ matrix.digest }}
      FINESHELL_OTA_PUBLIC_DIRECT: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "26"
          architecture: ${{ matrix.arch }}
      - name: Download the official v0.6.2 baseline and check the public update feed
        run: |
          if ($env:RUNNER_ARCH -ne $env:WINDOWS_ARCH) { throw 'Runner architecture differs from installer architecture.' }
          $newFeed = Invoke-RestMethod 'https://github.com/makessr/ZhanDu/releases/latest/download/latest.json' -TimeoutSec 20
          if ($newFeed.version -ne '0.6.3') { throw 'The expected public update sequence is unavailable.' }
          $file = Join-Path $env:RUNNER_TEMP 'FineShell-v0.6.2.exe'
          $url = "https://github.com/makessr/ZhanDu/releases/download/v0.6.2/FineShell_0.6.2_windows_$env:WINDOWS_ARCH-setup.exe"
          curl.exe --silent --show-error --fail --location --retry 3 --output $file $url
          if ($LASTEXITCODE -or (Get-FileHash -LiteralPath $file).Hash -ne $env:BASELINE_SHA256) { throw 'The baseline installer did not match the official asset.' }
      - name: Upgrade through GitHub Direct and reconnect to saved hosts
        run: |
          npm install --prefix "$env:RUNNER_TEMP/fixture" --ignore-scripts --no-audit --no-fund ssh2@1.17.0
          if ($LASTEXITCODE) { throw 'Could not install the loopback SSH fixture.' }
          $baseline = Join-Path $env:RUNNER_TEMP 'FineShell-v0.6.2.exe'
          $fixture = Join-Path $env:RUNNER_TEMP 'fixture/node_modules/ssh2/lib/index.js'
          ./scripts/windows-smoke/ota.ps1 -VerifiedInstaller $baseline -Baseline 0.6.2 -Target 0.6.3 -Ssh2Module $fixture -UseHostedRunnerWebView2Policy -RequireArm64:($env:WINDOWS_ARCH -eq 'arm64')

  desktop:
    name: Debian ${{ matrix.debian }} / ${{ matrix.arch }}
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        debian: ['12', '13']
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Upgrade the public package through XFCE
        env:
          DEBIAN_VERSION: ${{ matrix.debian }}
          ARCH: ${{ matrix.arch }}
          DIGEST: ${{ matrix.arch == 'arm64' && '97903c1ed788e5e1086c35ec81cbcda6e306919267499e0f2cc058ce6b21333f' || '2ae243bfe625c5a4a92d233d549985bb2cbd194706f6213da65c2f50e05b29d1' }}
        run: |
          set -Eeuo pipefail
          artifact="FineShell_0.6.2_linux_$ARCH.deb"
          pkg="$RUNNER_TEMP/$artifact"
          curl -fsSL --retry 3 -o "$pkg" "https://github.com/makessr/ZhanDu/releases/download/v0.6.2/$artifact"
          printf '%s  %s\n' "$DIGEST" "$pkg" | sha256sum --check
          for release in ZhanDu:0.6.3; do
            repo="${release%:*}"
            version="${release#*:}"
            curl -fsSL --retry 3 "https://github.com/makessr/$repo/releases/latest/download/latest.json" |
              jq -e --arg version "$version" '.version == $version'
          done
          docker run --rm --platform "linux/$ARCH" \
            --mount "type=bind,src=$GITHUB_WORKSPACE/scripts/linux-smoke/press-update.py,dst=/tmp/press-update.py,readonly" \
            --mount "type=bind,src=$pkg,dst=/tmp/zhandu.deb,readonly" \
            --mount "type=bind,src=$GITHUB_WORKSPACE/scripts/linux-smoke/debian-xfce.sh,dst=/tmp/debian-xfce.sh,readonly" \
            "debian:$DEBIAN_VERSION" bash /tmp/debian-xfce.sh "$DEBIAN_VERSION" "$ARCH"
