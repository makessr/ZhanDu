name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  sync-server:
    name: Host sync service tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "26"
      - run: npm ci --prefix sync-server --ignore-scripts
      - run: node --test sync-server/*.integration.mjs

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bun run build

  rust:
    name: Rust tests and Clippy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install Tauri system dependencies
        timeout-minutes: 8
        shell: bash
        run: |
          sources="$RUNNER_TEMP/tauri-ubuntu.sources"
          cat > "$sources" <<'EOF'
          Types: deb
          URIs: https://archive.ubuntu.com/ubuntu/
          Suites: noble noble-updates noble-backports
          Components: main restricted universe multiverse
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg

          Types: deb
          URIs: https://security.ubuntu.com/ubuntu/
          Suites: noble-security
          Components: main restricted universe multiverse
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          EOF

          apt_options=(
            -o "Dir::Etc::sourcelist=$sources"
            -o Dir::Etc::sourceparts=-
            -o Acquire::Retries=2
            -o Acquire::https::Timeout=20
            -o APT::Update::Error-Mode=any
          )
          sudo apt-get "${apt_options[@]}" update
          sudo apt-get "${apt_options[@]}" install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            wget
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features --locked -- -D warnings
