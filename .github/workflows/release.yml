name: Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "版本标签，例如 v0.1.0（必须与应用版本一致）"
        required: true
        type: string
  push:
    branches:
      - main
    paths:
      - src-tauri/tauri.conf.json

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      release_tag: ${{ steps.version.outputs.release_tag }}
      should_release: ${{ steps.trigger.outputs.should_release }}
      platforms: ${{ steps.platforms.outputs.platforms }}
      matrix: ${{ steps.platforms.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Require manual releases from main
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        run: |
          echo "Manual releases must run from main." >&2
          exit 1
      - id: trigger
        name: Detect application version change
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          current_version="$(jq -r '.version' src-tauri/tauri.conf.json)"
          previous_version="$(git show "$BEFORE_SHA:src-tauri/tauri.conf.json" | jq -r '.version')"
          if [[ "$current_version" == "$previous_version" ]]; then
            echo "Application version remains $current_version; skipping release."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "Application version changed: $previous_version -> $current_version"
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        if: steps.trigger.outputs.should_release == 'true'
        with:
          bun-version: 1.3.11
      - name: Verify release commit belongs to main
        if: steps.trigger.outputs.should_release == 'true'
        run: |
          git fetch origin main --no-tags
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - id: version
        name: Validate application version and update channel
        if: steps.trigger.outputs.should_release == 'true'
        env:
          REQUESTED_RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || '' }}
        run: |
          release_tag="$REQUESTED_RELEASE_TAG"
          if [[ -z "$release_tag" ]]; then
            version="$(bun -e 'const value = await Bun.file("package.json").json(); console.log(value.version)')"
            release_tag="v$version"
          fi
          bun scripts/check-release-version.ts "$release_tag" "$GITHUB_REPOSITORY"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
      - name: Validate release notes
        if: steps.trigger.outputs.should_release == 'true'
        env:
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
        run: bun scripts/extract-release-notes.ts "$RELEASE_TAG" > /tmp/release-notes.md
      - id: platforms
        name: Select release platforms
        if: steps.trigger.outputs.should_release == 'true'
        env:
          RELEASE_PLATFORMS: ${{ vars.FINESHELL_RELEASE_PLATFORMS || 'all' }}
          RELEASE_MATRIX: >-
            [
              {"name":"macOS Apple Silicon","platform":"macos-latest","rustTargets":"aarch64-apple-darwin","args":"--target aarch64-apple-darwin --bundles app,dmg","appleSigningIdentity":"-"},
                {"name":"macOS Intel","platform":"macos-latest","rustTargets":"x86_64-apple-darwin","args":"--target x86_64-apple-darwin --bundles app,dmg","appleSigningIdentity":"-","rustCacheKey":"macos-intel-cross"},
              {"name":"Linux x64","platform":"ubuntu-22.04","rustTargets":"","args":"--bundles deb","appleSigningIdentity":""},
              {"name":"Linux ARM64","platform":"ubuntu-22.04-arm","rustTargets":"aarch64-unknown-linux-gnu","args":"--target aarch64-unknown-linux-gnu --bundles deb","appleSigningIdentity":""},
              {"name":"Windows x64","platform":"windows-latest","rustTargets":"","args":"--bundles nsis,msi","appleSigningIdentity":""},
              {"name":"Windows ARM64","platform":"windows-11-arm","rustTargets":"aarch64-pc-windows-msvc","args":"--target aarch64-pc-windows-msvc --bundles nsis","appleSigningIdentity":""}
            ]
        run: |
          case "$RELEASE_PLATFORMS" in
            all) matrix="$(jq -c . <<< "$RELEASE_MATRIX")" ;;
            windows) matrix="$(jq -c 'map(select(.platform | startswith("windows-")))' <<< "$RELEASE_MATRIX")" ;;
            *) echo "Invalid FINESHELL_RELEASE_PLATFORMS value" >&2; exit 1 ;;
          esac
          echo "platforms=$RELEASE_PLATFORMS" >> "$GITHUB_OUTPUT"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  prepare:
    name: Prepare draft release
    needs: validate
    if: needs.validate.outputs.should_release == 'true'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release_id: ${{ steps.release.outputs.release_id }}
    steps:
      - id: release
        name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.validate.outputs.release_tag }}
        run: |
          prerelease=false
          if [[ "$RELEASE_TAG" == *-* ]]; then
            prerelease=true
          fi

          release_id="$(
            gh api \
              --method POST \
              "repos/$GITHUB_REPOSITORY/releases" \
              -F tag_name="$RELEASE_TAG" \
              -F target_commitish="$GITHUB_SHA" \
              -F name="栈渡 $RELEASE_TAG" \
              -F body="" \
              -F draft=true \
              -F prerelease="$prerelease" \
              --jq '.id'
          )"
          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.name }}
    needs:
      - validate
      - prepare
    if: needs.validate.outputs.should_release == 'true'
    environment: release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.validate.outputs.matrix) }}
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Linux system dependencies
        if: startsWith(matrix.platform, 'ubuntu-')
        timeout-minutes: 8
        shell: bash
        run: |
          bash scripts/install-tauri-linux-dependencies.sh \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev \
            patchelf \
            xdg-utils
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.11
      - id: release_notes
        name: Prepare updater release notes
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.release_tag }}
        run: |
          delimiter="FINESHELL_RELEASE_NOTES_${RANDOM}_${RANDOM}_${RANDOM}"
          echo "body<<$delimiter" >> "$GITHUB_OUTPUT"
          bun scripts/extract-release-notes.ts "$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "$delimiter" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          targets: ${{ matrix.rustTargets }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: ${{ matrix.rustCacheKey }}
          workspaces: src-tauri -> target
      - name: Identify Windows ARM64 OpenSSL cache
        id: openssl
        if: matrix.platform == 'windows-11-arm'
        shell: pwsh
        run: ./scripts/windows-openssl-cache.ps1 -Mode key
      - name: Restore Windows ARM64 OpenSSL libraries
        id: openssl_restore
        if: matrix.platform == 'windows-11-arm'
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          key: ${{ steps.openssl.outputs.key }}
          path: ${{ steps.openssl.outputs.path }}
      - name: Select Windows ARM64 OpenSSL build
        if: matrix.platform == 'windows-11-arm'
        shell: pwsh
        run: ./scripts/windows-openssl-cache.ps1 -Mode use
      - name: Install frontend dependencies
        run: bun install --frozen-lockfile
      - name: Build installers and upload release assets
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        env:
          APPLE_SIGNING_IDENTITY: ${{ matrix.appleSigningIdentity }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: ${{ matrix.args }} -- --timings
          generateReleaseNotes: false
          prerelease: ${{ contains(needs.validate.outputs.release_tag, '-') }}
          releaseId: ${{ needs.prepare.outputs.release_id }}
          releaseAssetNamePattern: "${{ runner.os == 'Windows' && 'ZhanDu' || '[name]' }}_[version]_[platform]_[arch][setup][ext]"
          releaseBody: ${{ steps.release_notes.outputs.body }}
          releaseDraft: true
          releaseName: 栈渡 ${{ needs.validate.outputs.release_tag }}
          retryAttempts: 2
          tagName: ${{ needs.validate.outputs.release_tag }}
          tauriScript: bun tauri
          updaterJsonPreferNsis: true
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
      - name: Collect Windows ARM64 OpenSSL libraries
        id: openssl_collect
        if: matrix.platform == 'windows-11-arm' && steps.openssl_restore.outputs.cache-hit != 'true'
        shell: pwsh
        run: ./scripts/windows-openssl-cache.ps1 -Mode save
      - name: Save Windows ARM64 OpenSSL libraries
        if: steps.openssl_collect.outputs.saved == 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          key: ${{ steps.openssl.outputs.key }}
          path: ${{ steps.openssl.outputs.path }}
      - name: Upload Cargo build timings
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: cargo-timings-${{ matrix.platform }}-${{ matrix.rustTargets || 'native' }}
          path: src-tauri/target/cargo-timings/cargo-timing.html
          retention-days: 7
          if-no-files-found: ignore
      - name: Verify macOS binary architecture and dependencies
        if: startsWith(matrix.platform, 'macos-')
        shell: bash
        env:
          RUST_TARGET: ${{ matrix.rustTargets }}
        run: |
          # Tauri removes the temporary .app after creating the DMG, while the
          # linked release executable remains available for dependency checks.
          binary="src-tauri/target/$RUST_TARGET/release/fineshell"
          if [[ ! -x "$binary" ]]; then
            echo "macOS application binary not found: $binary" >&2
            exit 1
          fi
          case "$RUST_TARGET" in
            aarch64-apple-darwin) expected_arch=arm64 ;;
            x86_64-apple-darwin) expected_arch=x86_64 ;;
            *) echo "Unexpected macOS target: $RUST_TARGET" >&2; exit 1 ;;
          esac
          actual_arch="$(lipo -archs "$binary")"
          if [[ "$actual_arch" != "$expected_arch" ]]; then
            echo "Expected $expected_arch, found $actual_arch in $binary" >&2
            exit 1
          fi

          otool -L "$binary"
          unexpected_dependencies="$(
            otool -L "$binary" \
              | tail -n +2 \
              | awk '{ print $1 }' \
              | awk '!/^\/System\// && !/^\/usr\/lib\// && !/^@rpath\// && !/^@loader_path\// && !/^@executable_path\// { print }'
          )"
          if [[ -n "$unexpected_dependencies" ]]; then
            echo "macOS binary contains non-system absolute dependencies:" >&2
            echo "$unexpected_dependencies" >&2
            exit 1
          fi

  finalize-draft:
    name: Finalize release draft
    needs:
      - validate
      - prepare
      - build
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.11
      - name: Check release draft and download updater manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.validate.outputs.release_tag }}
          RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
        run: |
          mkdir -p "$RUNNER_TEMP/updater"
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
            > "$RUNNER_TEMP/updater/release.json"
          jq -e --arg tag "$RELEASE_TAG" --arg commit "$GITHUB_SHA" \
            '.draft and .tag_name == $tag and .target_commitish == $commit' \
            "$RUNNER_TEMP/updater/release.json" > /dev/null
          gh release download "$RELEASE_TAG" \
            --pattern latest.json \
            --dir "$RUNNER_TEMP/updater"
      - name: Normalize updater download URLs
        run: |
          bun scripts/normalize-updater-manifest.ts \
            "$RUNNER_TEMP/updater/latest.json" \
            "$RUNNER_TEMP/updater/release.json" \
            "$RELEASE_TAG"
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.release_tag }}
      - name: Validate updater manifest
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.release_tag }}
          RELEASE_PLATFORMS: ${{ needs.validate.outputs.platforms }}
        run: |
          bun scripts/validate-updater-manifest.ts \
            "$RUNNER_TEMP/updater/latest.json" "$RELEASE_TAG" "$GITHUB_REPOSITORY" "$RELEASE_PLATFORMS"
      - name: Upload normalized updater manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.validate.outputs.release_tag }}
        run: gh release upload "$RELEASE_TAG" "$RUNNER_TEMP/updater/latest.json" --clobber
      - name: Prepare release notes
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.release_tag }}
        run: bun scripts/extract-release-notes.ts "$RELEASE_TAG" > "$RUNNER_TEMP/release-notes.md"
      - name: Verify production sync service
        if: vars.FINESHELL_SYNC_HEALTH_URL != ''
        env:
          SYNC_HEALTH_URL: ${{ vars.FINESHELL_SYNC_HEALTH_URL }}
        run: |
          set -o pipefail
          curl --fail --silent --show-error --max-time 15 "$SYNC_HEALTH_URL" |
            jq -e '(.service == "zhandu" or .service == "fineshell-sync") and .status == "ok"'
      - name: Save release notes and report the draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.validate.outputs.release_tag }}
          RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
        shell: bash
        run: |
          endpoint="repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID"
          metadata='.draft and .tag_name == $tag and .target_commitish == $commit'
          jq_args=(--arg tag "$RELEASE_TAG" --arg commit "$GITHUB_SHA")
          gh api "$endpoint" | jq -e "${jq_args[@]}" "$metadata" >/dev/null
          draft_url="$(
            gh api --method PATCH "$endpoint" \
              -f "tag_name=$RELEASE_TAG" -f "target_commitish=$GITHUB_SHA" \
              -F "body=@$RUNNER_TEMP/release-notes.md" |
              jq -er "${jq_args[@]}" "select($metadata) | .html_url"
          )"
          printf 'Release draft [%s](%s) is ready for acceptance.\n' \
            "$RELEASE_TAG" "$draft_url" >> "$GITHUB_STEP_SUMMARY"
