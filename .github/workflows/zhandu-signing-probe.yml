name: ZhanDu updater signing probe

on:
  push:
    branches: [test/zhandu-signing-key]

permissions:
  contents: read

jobs:
  verify:
    if: github.repository == 'makessr/ZhanDu'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - uses: dtolnay/rust-toolchain@stable
      - run: bun install --frozen-lockfile
      - run: cargo build --locked --manifest-path scripts/verify-release-signature/Cargo.toml --target-dir "$RUNNER_TEMP/verifier"
      - name: Sign a disposable file using the new ZhanDu repository secrets
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          test -n "$TAURI_SIGNING_PRIVATE_KEY"
          test -n "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD"
          printf '%s\n' 'ZhanDu updater signing verification' > "$RUNNER_TEMP/signing-probe"
          bun tauri signer sign "$RUNNER_TEMP/signing-probe" >/dev/null
      - name: Verify the signature using the public key embedded in ZhanDu
        run: |
          public_key="$(bun -e 'console.log((await Bun.file("src-tauri/tauri.conf.json").json()).plugins.updater.pubkey)')"
          "$RUNNER_TEMP/verifier/debug/verify-release-signature" "$public_key" "$RUNNER_TEMP/signing-probe" "$RUNNER_TEMP/signing-probe.sig"
          echo 'The ZhanDu repository secrets signed a payload that the configured public key verified.'
