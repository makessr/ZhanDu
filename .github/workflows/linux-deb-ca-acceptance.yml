name: Verify Linux package CA dependency

on:
  push:
    branches: [test/linux-deb-ca-certificates]

permissions:
  contents: read

jobs:
  deb:
    name: Check package dependency / ${{ matrix.arch }}
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-22.04-arm' || 'ubuntu-22.04' }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - run: bun install --frozen-lockfile
      - name: Rebundle the verified public client using the candidate Linux config
        env:
          ARCH: ${{ matrix.arch }}
          DIGEST: ${{ matrix.arch == 'arm64' && '97903c1ed788e5e1086c35ec81cbcda6e306919267499e0f2cc058ce6b21333f' || '2ae243bfe625c5a4a92d233d549985bb2cbd194706f6213da65c2f50e05b29d1' }}
          CARGO_TARGET_DIR: ${{ runner.temp }}/tauri-target
        shell: bash
        run: |
          baseline="$RUNNER_TEMP/FineShell_0.6.2_linux_$ARCH.deb"
          curl -fsSL --retry 3 --output "$baseline" "https://github.com/makessr/ZhanDu/releases/download/v0.6.2/${baseline##*/}"
          printf '%s  %s\n' "$DIGEST" "$baseline" | sha256sum --check
          dpkg-deb -f "$baseline" Depends
          dpkg-deb -x "$baseline" "$RUNNER_TEMP/baseline"
          install -D "$RUNNER_TEMP/baseline/usr/bin/fineshell" "$CARGO_TARGET_DIR/release/fineshell"
          mkdir -p dist
          bun run tauri bundle --bundles deb --ci --no-sign --config '{"bundle":{"createUpdaterArtifacts":false}}'
          shopt -s nullglob
          packages=("$CARGO_TARGET_DIR/release/bundle/deb/"*.deb)
          test "${#packages[@]}" -eq 1
          package="${packages[0]}"
          test "$(dpkg-deb -f "$package" Architecture)" = "$ARCH"
          dependencies="$(dpkg-deb -f "$package" Depends)"
          printf 'Candidate dependencies: %s\n' "$dependencies"
          for name in ca-certificates libgtk-3-0 libwebkit2gtk-4.1-0; do
            tr ',' '\n' <<< "$dependencies" | grep -E "^ *$name( |$)"
          done
          cp "$package" "$RUNNER_TEMP/zhandu-ca-candidate.deb"
      - name: Install through APT without recommended packages
        env:
          ARCH: ${{ matrix.arch }}
        shell: bash
        run: |
          for version in 12 13; do
            docker run --rm --platform "linux/$ARCH" \
              --env DEBIAN_FRONTEND=noninteractive \
              --mount "type=bind,src=$RUNNER_TEMP/zhandu-ca-candidate.deb,dst=/tmp/zhandu.deb,readonly" \
              "debian:$version-slim" bash -Eeuo pipefail -c '
                test ! -s /etc/ssl/certs/ca-certificates.crt
                apt-get -o Acquire::Retries=3 update -qq
                apt-get -o Acquire::Retries=3 install -y --no-install-recommends /tmp/zhandu.deb
                test "$(dpkg-query -W -f="\${Status}" ca-certificates)" = "install ok installed"
                test -s /etc/ssl/certs/ca-certificates.crt
                apt-get -o Acquire::Retries=3 install -y --no-install-recommends curl
                curl -fsSL --retry 3 -o /dev/null https://github.com/makessr/ZhanDu/releases/latest/download/latest.json
                printf "Debian %s / %s installed its trust store and reached the public update feed.\n" "$1" "$2"
              ' bash "$version" "$ARCH"
          done
