name: Verify Linux release dependency installation

on:
  push:
    branches: [test/linux-release-apt-sources]

permissions:
  contents: read

jobs:
  linux:
    name: Ubuntu 22.04 / ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - name: Rehearse the release dependency step
        timeout-minutes: 8
        shell: bash
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          test "$(dpkg --print-architecture)" = "$ARCH"
          bun -e '
            const workflow = Bun.YAML.parse(await Bun.file(".github/workflows/release.yml").text());
            const step = workflow.jobs.build.steps.find(step => step.name === "Install Linux system dependencies");
            if (!step?.run) throw Error("Release dependency step is missing");
            await Bun.write(process.argv[1], step.run);
          ' "$RUNNER_TEMP/install-release-deps.sh"
          bash -n "$RUNNER_TEMP/install-release-deps.sh"
          bash -Eeuo pipefail "$RUNNER_TEMP/install-release-deps.sh"
          pkg-config --modversion webkit2gtk-4.1 librsvg-2.0 ayatana-appindicator3-0.1
          patchelf --version
          dpkg-query -W xdg-utils